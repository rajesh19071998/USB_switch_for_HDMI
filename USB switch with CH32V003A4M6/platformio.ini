; PlatformIO Project Configuration File
;
;   Build options: build flags, source filter
;   Upload options: custom upload port, speed and extra flags
;   Library options: dependencies, extra library storages
;   Advanced options: extra scripting
;
; Please visit documentation for the other options and examples
; https://docs.platformio.org/page/projectconf.html

[env:genericCH32V003A4M6]
platform = ch32v
board = genericCH32V003A4M6
framework = noneos-sdk
extra_scripts = post:scripts/update_readme_memory.py

; CH32V003A4M6 board configuration

; Use the WCH-LinkE debugger/programmer for upload and debugging
upload_protocol = wlink
debug_tool = wch-link
; Optional: break at main when a debug session starts
debug_init_break = tbreak main